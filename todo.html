```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple To-Do List application to manage daily tasks.">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <h1>My To-Do List</h1>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="project.html">Projects</a>
            <a href="contact.html">Contact</a>
            <a href="todo.html">To-Do List</a>
            <button id="theme-toggle" type="button">
    Dark Mode
</button>
        </nav>
    </header>

    <main id="main-content">
        <section>
            <h2>Manage Your Tasks</h2>

            <form id="todo-form">
                <label for="task-input">Enter a task</label>
                <input
                    type="text"
                    id="task-input"
                    placeholder="What do you need to do?"
                    required
                >
                <button type="submit" id="add-button">Add Task</button>
            </form>

            <div class="todo-filters" aria-label="Filter tasks">
                <button type="button" data-filter="all">All</button>
                <button type="button" data-filter="active">Active</button>
                <button type="button" data-filter="completed">Completed</button>
            </div>

            <p id="task-count" aria-live="polite">0 tasks remaining</p>

            <ul id="task-list" aria-label="Your tasks"></ul>
            <p id="empty-message">No tasks yet. Add your first task!</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Romila. All rights reserved.</p>
    </footer>

    <script src="js/todo.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
```
